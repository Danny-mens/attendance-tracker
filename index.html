<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Student Attendance Tracker</h1>
    </header>

    <main>
        <section class="card">
            <h2>Add Student</h2>
            <form id="student-form">
                <input type="text" id="student-number" placeholder="Student ID" required>
                <input type="text" id="full-name" placeholder="Full name" required>

                <button type="submit">Add</button>
            </form>
        </section>

        <section class="card">
            <h2>Mark Attendance</h2>
            
            <label for="date">Date:</label>
            <input type="date" id="date">
                            <input type="text" id="search" placeholder="Search by name or number...">

            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="attendance-body"></tbody>
            </table>

            <button id="save-btn">Save Attendance</button>
            <p id="message"></p>
        </section>
        <section class="card">
    <h2>Attendance Summary</h2>
    <table>
        <thead>
            <tr>
                <th>Student No.</th><th>Name</th><th>Present</th>
                <th>Late</th><th>Absent</th><th>Attendance %</th>
            </tr>
        </thead>
        <tbody id="summary-body"></tbody>
    </table>
</section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
