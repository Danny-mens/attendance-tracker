<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance · AttendEase</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="attendance" data-title="Attendance">
<div class="app-shell">
    <main class="main-area">
        <div class="content">
            <div class="page-heading">
                <div>
                    <p class="eyebrow">DAILY REGISTER</p>
                    <h1>Take attendance</h1>
                    <p class="muted">Add students, then mark each one present, absent or late.</p>
                </div>
            </div>

            <section class="panel stack">
                <h2 class="section-title">Add student</h2>
                <form id="student-form" class="filters">
                    <input class="input" type="text" id="student-number" placeholder="Student ID" required>
                    <input class="input" type="text" id="full-name" placeholder="Full name" required>
                   <input class="input" type="text" id="class-name" list="class-suggestions" placeholder="Class (e.g. Level 200 IT)">
<datalist id="class-suggestions"></datalist>
   
                    <button class="btn btn-primary" type="submit">＋ Add student</button>
                </form>
            </section>

            <section class="panel stack">
                <div class="filters">
                    <div class="filter-field">
                        <label for="date">Attendance date</label>
                        <input class="input" type="date" id="date">
                    </div>
                    <div class="filter-field">
                        <label for="search">Search</label>
                        <input class="input" type="text" id="search" placeholder="Search name or student ID…">
                    </div>
                    <div class="filter-field">
    <label for="class-filter">Class</label>
    <select class="input" id="class-filter">
        <option value="0">All classes</option>
    </select>
</div>
                </div>

                <div class="attendance-toolbar">
                    <span class="muted" id="count"></span>
                    <button class="btn btn-ghost btn-small" id="mark-all" type="button">Mark all present</button>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                           <tr><th>STUDENT</th><th>CLASS</th><th>ATTENDANCE STATUS</th><th>ACTIONS</th></tr>
                        <tbody id="attendance-body"></tbody>
                    </table>
                </div>

                <div class="form-actions">
                    <span id="message"></span>
                    <button class="btn btn-primary" id="save-btn" type="button">Save attendance</button>
                </div>
            </section>

            <section class="panel">
                <div class="panel-heading">
                    <div>
                        <h2>Attendance summary</h2>
                        <p class="muted">Totals across all saved dates</p>
                    </div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>STUDENT</th><th>PRESENT</th><th>LATE</th><th>ABSENT</th><th>EXCUSED</th></tr>
                        </thead>
                        <tbody id="summary-body"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</div>

<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
